name: Build Nuvio Unsigned IPA

# Builds the NuvioMedia/NuvioMobile Compose Multiplatform app into an
# unsigned iOS .ipa on a GitHub-hosted macOS runner, then uploads it as
# a workflow artifact. No Apple signing certificate is required.
#
# Trigger it manually from the Actions tab (Run workflow).

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Source repo to build (owner/name)"
        required: true
        default: "NuvioMedia/NuvioMobile"
      ref:
        description: "Branch, tag, or SHA to build"
        required: true
        default: "cmp-rewrite"

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout Nuvio source (with submodules)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repository }}
          ref: ${{ github.event.inputs.ref }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          java -version
          ./gradlew --version

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package .app into unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app product found under build/Build/Products/Release-iphoneos"
            find build/Build/Products -maxdepth 2 -print
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Nuvio-unsigned.ipa Payload
          echo "----"
          ls -lh Nuvio-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-unsigned-ipa
          path: Nuvio-unsigned.ipa
          if-no-files-found: error
